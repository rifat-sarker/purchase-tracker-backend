events {
  worker_connections 1024;
}

http {
  # Docker Compose's embedded DNS resolves the `api` service name to the
  # IP of every running replica and round-robins between them on each new
  # connection to that name. `least_conn` here adds a second layer of
  # balancing on top of that: nginx picks the upstream with the fewest
  # currently active connections, which handles uneven request durations
  # better than plain round-robin once you're behind this proxy.
  upstream api_backend {
    least_conn;
    server api:4000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # What a load balancer would probe to decide whether to keep routing
    # traffic to a given replica. NOTE: nginx OSS does not perform *active*
    # upstream health checks on its own (it only reacts passively to
    # failed proxied requests) — `nginx_upstream_check_module` or nginx
    # Plus would be the next step if active checks become necessary. Until
    # then, an external prober (Docker HEALTHCHECK, an orchestrator, or a
    # cron) should hit this path directly against each replica.
    location /health {
      proxy_pass http://api_backend/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
